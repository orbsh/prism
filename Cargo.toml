[workspace]
resolver = "2"
members = [
    "crates/prism-protocol",
    "crates/prism",
]
# echo-wasm is wasm32-only (panic handler + no_std without host std);
# build.sh compiles it standalone against --target wasm32-unknown-unknown.
exclude = ["examples/echo-wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
ciborium = "0.2"
