# The page frame — the part of the page the venue owns.
#
# ONE accrete node. `regions` is a DECLARATION, not a drawing: the venue reads it to know which
# booths this page has and what to call them in the navigation. The pager's own rows come from a
# list slot (only a list slot can put a page on screen), so nothing about the regions is drawn here.
#
# A deployment points `PRISM_SHELL` at its frame; unset, `shell.yaml` is read from beside the
# executable, so a binary shipped with its frame needs no configuration at all.
#
# Bindings are addresses, not modes (fluxen ADR 0031): `source` is where a value comes from,
# `sink` is where it goes. `scope` says who owns it — `remote` (the default, written by the far
# side and replayed) or `local` (this page only, dies with the tree) — so it is written only when
# it is `local`.

type: frame
attrs:
  class: [maximize, col]

regions:
  - booth: gravity-model
    label: 对话
  - booth: admin
    label: 管理

children:
  # ── 顶栏：三部分 ────────────────────────────────────────────────────────────
  # 左：这是哪个部署。中：导航。右：消息与设置。空白（main）把后两个推到尽头。
  - type: frame
    attrs:
      class: [--head, nogrow, horizontal, center, box, gap]
    children:
      - type: text
        attrs:
          class: [nogrow]
        source:
          default: this deployment

      # 导航：选项由 venue 给（每个 region 一行，label 取自 frame 自己）。点一行既切页
      # （local 槽 page），也把去向告诉 venue —— 旧写法的 report=island 说的就是"值再
      # 流出去一次"（ADR 0028：载荷是这次的值本身），现在它是同一个值的写通道：
      # sink 的地址仍是 island，remote 是缺省，所以只写 slot。
      - type: select
        attrs:
          horizontal: true
          class: [main]
        source:
          slot: page
          scope: local
          path: /data
          default: gravity-model
        # 读本地、写远端：选择落在 page 上，同一份值再从 island 这个地址上行，
        # venue 才知道该给哪个 booth 触发 connect。
        sink:
          slot: island
        options:
          slot: nav

      - type: frame
        attrs:
          class: [main]

      # 消息与设置：右侧的功能都在这一个边栏里展开（贴视口 + 本地切换 = 抽屉）。
      # 不数未读 —— 未读数要"点一次才算已读"，操作繁琐、实现也要新机制；
      # 一个按钮打开列表就够了，列表读的是同一个 notice 槽。
      - type: panel
        id: rail
        attrs:
          place: viewport
          state: toggle
          direction: R
          width: min(34rem, 92vw)
        children:
          # 触发器
          - type: text
            attrs:
              class: [nogrow]
            source:
              default: 消息
          # 边栏本体：纵向排列，以后新的功能往下加一节即可。
          - type: frame
            attrs:
              class: [col, gap]
            children:
              # 通知：每一行都在，过期只是"不上台"（右上角那个 rack 才让行退休）。
              - type: tiles
                attrs:
                  class: [col, gap]
                source:
                  slot: notice
              # 管理：venue 往 admin 槽里画什么，这里就显示什么；空槽什么也不画。
              - type: frame
                attrs:
                  class: [col, gap]
                source:
                  slot: admin

      # 设置：登录/登出与设备列表都由 venue 画进 auth 槽，这里只给一个入口。
      - type: panel
        id: settings
        attrs:
          place: anchor
          class: [nogrow]
        children:
          - type: text
            source:
              default: 设置
          - type: frame
            attrs:
              class: [col, gap]
            source:
              slot: auth

      - type: text
        attrs:
          class: [nogrow, --user]
        source:
          slot: user

  # ── 桌面 ────────────────────────────────────────────────────────────────────
  - type: tiles
    attrs:
      class: [main, shrink]
      window: {size: 1}
      # 舞台由哪个值决定：本地的 page 槽（导航写、这里读），remote 是缺省所以只写 local。
      step: {slot: page}
    source:
      slot: pages

  # ── 通知：右上角，一条一行，一次三条，四秒推进一格 ─────────────────────────────
  # 窗口：舞台一次放三条，计时器每四秒把窗口往后挪一格；离窗的行仍留在槽里（消息列表里看得见）。
  # 底纹挂在行上（每条通知自己是气泡），所以舞台空了容器什么也画不出来 —— 不需要显隐规则。
  # 通知窗口：面板贴右上角（place: viewport + 位置 = 原来的 float），显隐跟着 notice 槽。
  - type: panel
    attrs:
      place: viewport
      state: bound
      right: 1rem
      top: 1rem
      dismiss: false
    source:
      slot: notice
    children:
      - type: tiles
        attrs:
          class: [col, jc-end, gap]
          window: {size: 3}
          step: {timer: 4000}
        source:
          slot: notice