# The page frame — the part of the page the venue owns.
#
# ONE accrete node. `regions` is a DECLARATION, not a drawing: the venue reads it to know which
# booths this page has and what to call them in the navigation. The pager's own rows come from a
# list slot (only a list slot can put a page on screen), so nothing about the regions is drawn here.
#
# A deployment points `PRISM_SHELL` at its frame; unset, `shell.yaml` is read from beside the
# executable, so a binary shipped with its frame needs no configuration at all.

type: frame
attrs:
  class: [maximize, col]

regions:
  - booth: gravity-model
    label: 对话
  - booth: admin
    label: 管理

children:
  # ── 顶栏：三部分 ────────────────────────────────────────────────────────────
  # 左：这是哪个部署。中：导航。右：消息与设置。空白（main）把后两个推到尽头。
  - type: frame
    attrs:
      class: [--head, nogrow, horizontal, center, box, gap]
    children:
      - type: text
        attrs:
          class: [nogrow]
        bind:
          value:
            kind: default
            default: this deployment

      # 导航：选项由 venue 给（每个 region 一行，label 取自 frame 自己）。点一行既切页
      # （local 槽 page），也把去向告诉 venue —— report 走 island 动词，venue 才知道
      # 该给哪个 booth 触发 connect。
      - type: select
        attrs:
          horizontal: true
          class: [main]
        bind:
          value:
            kind: local
            slot: page
            report: island
            path: /data
            default: gravity-model
          options:
            kind: source
            source: nav

      - type: frame
        attrs:
          class: [main]

      # 消息与设置：右侧的功能都在这一个边栏里展开（贴视口 + 本地切换 = 抽屉）。
      # 不数未读 —— 未读数要"点一次才算已读"，操作繁琐、实现也要新机制；
      # 一个按钮打开列表就够了，列表读的是同一个 notice 槽。
      - type: panel
        id: rail
        attrs:
          place: viewport
          state: toggle
          direction: R
          width: min(34rem, 92vw)
        children:
          # 触发器
          - type: text
            attrs:
              class: [nogrow]
            bind:
              value:
                kind: default
                default: 消息
          # 边栏本体：纵向排列，以后新的功能往下加一节即可。
          - type: frame
            attrs:
              class: [col, gap]
            children:
              # 通知：每一行都在，过期只是"不上台"（右上角那个 rack 才让行退休）。
              - type: rack
                attrs:
                  view:
                    enter: fade
                  class: [col, gap]
                bind:
                  value:
                    kind: source
                    source: notice
              # 管理：venue 往 admin 槽里画什么，这里就显示什么；空槽什么也不画。
              - type: frame
                attrs:
                  class: [col, gap]
                bind:
                  value:
                    kind: source
                    source: admin

      # 设置：登录/登出与设备列表都由 venue 画进 auth 槽，这里只给一个入口。
      - type: panel
        id: settings
        attrs:
          place: anchor
          class: [nogrow]
        children:
          - type: text
            bind:
              value:
                kind: default
                default: 设置
          - type: frame
            attrs:
              class: [col, gap]
            bind:
              value:
                kind: source
                source: auth

      - type: text
        attrs:
          class: [nogrow, --user]
        bind:
          value:
            kind: source
            source: user

  # ── 桌面 ────────────────────────────────────────────────────────────────────
  - type: pages
    attrs:
      class: [main, shrink]
    bind:
      value:
        kind: source
        source: pages
      select:
        kind: local
        slot: page
        path: /data
        default: gravity-model
    display: dom

  # ── 通知：右上角，一条一行，各自到点离开 ──────────────────────────────────────
  # dwell：每行从上台起活 every 毫秒，然后下台，行仍留在槽里（消息列表里看得见）。
  # 底纹挂在行上（每条通知自己是气泡），所以舞台空了容器什么也画不出来 —— 不需要显隐规则。
  - type: float
    attrs:
      right: 1rem
      top: 1rem
    children:
      - type: rack
        attrs:
          view:
            enter: translate
            enter_ms: 220
            leave_ms: 200
            play: dwell
            every: 4000
          class: [col, jc-end, gap]
        bind:
          value:
            kind: source
            source: notice