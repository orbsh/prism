[package]
name = "prism"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prism-protocol = { path = "../prism-protocol" }
# prism's OWN storage: the account registry + device bindings live in a
# separate okm instance (ADR-0017 §7 amendment) — okm here is PRISM's
# storage, not aura's (aura sees identity only as payload metadata).
okm-core = { git = "https://github.com/orbsh/okm", branch = "main", features = ["fjall"] }
argon2 = "0.5"
aura-booth = { path = "../../../aura/crates/booth" }
aura-engine = { path = "../../../aura/crates/engine" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["handshake"] }
futures-util = "0.3"
base64 = "0.22"
aura-realm = { path = "../../../aura/crates/realm" }
gravity-booth = { path = "../../../gravity/crates/booth" }
effector-protocol = { path = "../../../effector/crates/protocol" }

[dev-dependencies]
tempfile = "3"
mem-server = { path = "../../../krystallizer/crates/mem-server" }
axum = "0.8"
tokio-tungstenite = { version = "0.24", features = ["handshake"] }
aura-config = { path = "../../../aura/crates/config" }
effector-runtime = { path = "../../../effector/crates/runtime" }
effector-config = { path = "../../../effector/crates/config" }

[features]
default = ["steel", "python", "fjall"]
steel = ["aura-engine/steel"]
python = ["aura-engine/python"]
fjall = ["aura-engine/fjall"]

[[bin]]
name = "prism"
path = "src/main.rs"
