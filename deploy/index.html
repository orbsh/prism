<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prism</title>
  <!-- THE BUNDLE IS THE ORIGIN (crates/prism/src/assets.rs): this file is `<root>/index.html`, the
       renderer's dist sits beside it, and every reference is absolute. Drop it in the deployment's
       asset root next to the fluxen bundle (manifest.json + the hashed js/wasm). -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/core.css">
  <link rel="stylesheet" href="/custom.css">
</head>
<body>
  <div id="ui"></div>
  <script type="module">
    // THE PAGE OWNS THREE THINGS THE RENDERER MUST NOT GUESS (fluxen ADR-0046):
    //   the codec  - what this deployment speaks on the wire;
    //   the token  - a session is one more query parameter, put there by whoever holds it;
    //   the address - prism reads `token` off the upgrade query (crates/prism/src/lib.rs:1046).
    const TOKEN_KEY = "prism:token";
    const codec = new URLSearchParams(location.search).get("codec") || "json";
    const said = new URLSearchParams(location.search).get("token");
    const token = said || localStorage.getItem(TOKEN_KEY) || "";
    if (said) localStorage.setItem(TOKEN_KEY, said);

    const manifest = await (await fetch("/manifest.json")).json();
    const { default: init, mount } = await import("/" + manifest.entry.js);
    await init({ module_or_path: "/" + manifest.entry.wasm });
    await mount(document.querySelector("#ui"), {
      codec,
      path: "/channel",           // prism's UI leg (ui::UI_PATH)
      // The handshake still carries the token: prism resolves identity at the upgrade so it can push the
      // shell before reading a byte (ui.rs:695-713). One RTT is the price of doing it the other way.
      query: token ? { token } : {},
      hooks: {
        // A rotated credential arrives as a `set` into `ui:token` (ui.rs:1080, 1129). The slot reports
        // its newest value once per pass, and the current value is replayed on subscribe - which is what
        // makes this work at all, since prism says it during the connection, before mount returns.
        slots: {
          "ui:token": (value) => {
            const fresh = value && (value.token ?? value);
            if (typeof fresh === "string" && fresh) localStorage.setItem(TOKEN_KEY, fresh);
          },
        },
      },
    });

    // The loop is closed by `hooks.slots` above (fluxen ADR 0047): a reload now finds the rotated token in
    // storage and hands it back on the address. Without that hook this page could not see the token at all
    // and every reload was a new device.
  </script>
</body>
</html>
